databaseChangeLog:
  - changeSet:
      id: 2026-07-31-create-order-items-table
      author: HuzovaAlina
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: order_items_pkey
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: order_items_order_id_fkey
                    referencedTableName: orders
                    referencedColumnNames: id
                    onUpdate: CASCADE
              - column:
                  name: item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: order_items_item_id_fkey
                    referencedTableName: items
                    referencedColumnNames: id
                    onUpdate: CASCADE
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - createIndex:
            indexName: order_items_order_id_idx
            tableName: order_items
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: order_items_item_id_idx
            tableName: order_items
            columns:
              - column:
                  name: item_id