apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-service-db
  namespace: dev
spec:
  serviceName: order-service-db-service
  selector:
    matchLabels:
      app: order-service-db
  template:
    metadata:
      labels:
        app: order-service-db
    spec:
      containers:
        - name: order-service-db
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: order-db-port
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: order-service-db-config
            - secretRef:
                name: order-service-db-secret
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: pgdata-order
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: pgdata-order
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi